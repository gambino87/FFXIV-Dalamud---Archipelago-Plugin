name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build plugin
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip "$env:APPDATA\XIVLauncher\addon\Hooks\dev\"

      - name: Restore
        run: dotnet restore .\ArchipelagoPlugin.sln

      - name: Build
        run: dotnet build .\ArchipelagoPlugin.sln -c Release --no-restore

      - name: Prepare custom repository manifest
        run: Copy-Item .\docs\custom-repo.example.json .\ArchipelagoPlugin\bin\x64\Release\ArchipelagoPlugin\repo.json

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArchipelagoPlugin
          path: |
            ArchipelagoPlugin/bin/x64/Release/ArchipelagoPlugin/latest.zip
            ArchipelagoPlugin/bin/x64/Release/ArchipelagoPlugin/ArchipelagoPlugin.json
            ArchipelagoPlugin/bin/x64/Release/ArchipelagoPlugin/repo.json

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ArchipelagoPlugin/bin/x64/Release/ArchipelagoPlugin/latest.zip
            ArchipelagoPlugin/bin/x64/Release/ArchipelagoPlugin/ArchipelagoPlugin.json
            ArchipelagoPlugin/bin/x64/Release/ArchipelagoPlugin/repo.json
