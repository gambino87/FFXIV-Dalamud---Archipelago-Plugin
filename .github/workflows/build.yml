name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build plugin
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\ArchipelagoPlugin.sln

      - name: Build
        run: dotnet build .\ArchipelagoPlugin.sln -c Release --no-restore

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArchipelagoPlugin
          path: |
            ArchipelagoPlugin/bin/x64/Release/ArchipelagoPlugin/latest.zip
            ArchipelagoPlugin/bin/x64/Release/ArchipelagoPlugin/ArchipelagoPlugin.json

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ArchipelagoPlugin/bin/x64/Release/ArchipelagoPlugin/latest.zip
            ArchipelagoPlugin/bin/x64/Release/ArchipelagoPlugin/ArchipelagoPlugin.json
